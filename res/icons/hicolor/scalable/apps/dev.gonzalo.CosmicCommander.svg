<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Cosmic Commander: two file panels side by side, the left one active. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8fd6"/>
      <stop offset="1" stop-color="#1d5a9e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3ecf5"/>
    </linearGradient>
  </defs>

  <!-- Rounded square base -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bg)"/>
  <rect x="6" y="6" width="116" height="58" rx="26" fill="#ffffff" opacity="0.08"/>

  <!-- Left panel (active: accent frame) -->
  <rect x="17" y="24" width="45" height="80" rx="7" fill="url(#panel)" stroke="#ffc83d" stroke-width="4"/>
  <rect x="17" y="24" width="45" height="14" rx="7" fill="#ffc83d"/>
  <rect x="17" y="31" width="45" height="7" fill="#ffc83d"/>
  <!-- folder + rows -->
  <path d="M24 46h8l3 3h12v10H24z" fill="#f2a93b"/>
  <rect x="24" y="66" width="31" height="4" rx="2" fill="#9fb3c8"/>
  <rect x="24" y="76" width="25" height="4" rx="2" fill="#9fb3c8"/>
  <rect x="24" y="86" width="29" height="4" rx="2" fill="#9fb3c8"/>

  <!-- Right panel -->
  <rect x="66" y="24" width="45" height="80" rx="7" fill="url(#panel)"/>
  <rect x="66" y="24" width="45" height="14" rx="7" fill="#c7d6e6"/>
  <rect x="66" y="31" width="45" height="7" fill="#c7d6e6"/>
  <rect x="73" y="48" width="31" height="4" rx="2" fill="#9fb3c8"/>
  <rect x="73" y="58" width="22" height="4" rx="2" fill="#9fb3c8"/>
  <rect x="73" y="68" width="28" height="4" rx="2" fill="#9fb3c8"/>
  <rect x="73" y="78" width="19" height="4" rx="2" fill="#9fb3c8"/>
  <rect x="73" y="88" width="25" height="4" rx="2" fill="#9fb3c8"/>
</svg>
