<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 2fip: two file panels, cyan and orange, each with a folder and files. -->
  <defs>
    <!-- A folder: the darker back with its tab, then the front. -->
    <g id="folder">
      <path d="M0 4.5v-1A3.5 3.5 0 0 1 3.5 0H17c1.6 0 2.6 1 4 2.4L23 4.5z" fill="#E4A83C"/>
      <rect y="4" width="32" height="27" rx="4" fill="#F7C553"/>
    </g>
    <!-- A file with a folded corner and a soft shadow. -->
    <g id="file">
      <path d="M3 1h4.5l4.5 4.5V13a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2z" fill="#D0D3DE"/>
      <path d="M2 0h5l4 4v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2z" fill="#F6F7F9"/>
      <path d="M7 0v4h4z" fill="#E1E3EC"/>
    </g>
  </defs>

  <!-- Left panel (cyan): shadow, rim, inside. -->
  <rect x="11" y="15" width="48" height="98" rx="14" fill="#007888"/>
  <rect x="10" y="12" width="48" height="98" rx="14" fill="#4AB8C7"/>
  <rect x="14" y="16" width="40" height="90" rx="10" fill="#105C68"/>
  <use href="#folder" x="19" y="22"/>
  <use href="#file" x="20" y="60"/>
  <use href="#file" x="35" y="60"/>

  <!-- Right panel (orange): shadow, rim, inside. -->
  <rect x="71" y="15" width="48" height="98" rx="14" fill="#B23300"/>
  <rect x="70" y="12" width="48" height="98" rx="14" fill="#EF652A"/>
  <rect x="74" y="16" width="40" height="90" rx="10" fill="#7B2101"/>
  <use href="#folder" x="79" y="22"/>
  <use href="#file" x="80" y="60"/>
</svg>
