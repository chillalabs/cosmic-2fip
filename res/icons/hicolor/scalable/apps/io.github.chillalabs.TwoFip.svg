<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 2fip: two file panels, teal and slate blue, each with a folder and files. -->
  <defs>
    <!-- A folder: the darker back peeking out above the front. -->
    <g id="folder">
      <rect width="25" height="19" rx="3" fill="#EAA934"/>
      <rect y="3" width="25" height="19" rx="3" fill="#F8C443"/>
    </g>
    <!-- A file with a soft shadow. -->
    <g id="file">
      <rect x="1" y="1" width="12" height="15" rx="2" fill="#CED1DC"/>
      <rect width="12" height="15" rx="2" fill="#F4F6FA"/>
    </g>
  </defs>

  <!-- Left panel (teal): shadow, rim, inside. -->
  <rect x="8" y="16" width="55" height="100" rx="6" fill="#006A73"/>
  <rect x="8" y="14" width="55" height="100" rx="6" fill="#27A6B3"/>
  <rect x="14" y="20" width="43" height="88" rx="4" fill="#1B4E59"/>
  <use href="#folder" x="20" y="29"/>
  <use href="#file" x="20" y="58"/>
  <use href="#file" x="20" y="78"/>

  <!-- Right panel (slate blue): shadow, rim, inside. -->
  <rect x="65" y="16" width="55" height="100" rx="6" fill="#455E89"/>
  <rect x="65" y="14" width="55" height="100" rx="6" fill="#7590BC"/>
  <rect x="71" y="20" width="43" height="88" rx="4" fill="#374A6A"/>
  <use href="#folder" x="77" y="29"/>
  <use href="#file" x="77" y="58"/>
</svg>
